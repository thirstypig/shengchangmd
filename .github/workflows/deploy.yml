name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the Pages deployment to read the repo and mint an ID token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a newer push supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # 55 tests over the i18n layer, source integrity and the indexing gate.
      # They guard defects that typecheck and build
      # cleanly — a practice.ts value with no translation, or a key missing from a
      # locale, either of which puts English or a raw key name in front of a
      # patient. Runs before the build so a locale regression blocks the deploy
      # rather than shipping.
      - name: Tests
        run: npm test

      # `postbuild` runs scripts/verify-css.mjs, which fails the build if the
      # compiled CSS is missing real Tailwind output. That guard exists because
      # this site once shipped with zero compiled CSS while the build passed.
      - run: npm run build
        env:
          # Feeds every canonical URL, sitemap entry, hreflang link and JSON-LD
          # @id. Moved to the apex on 2026-08-05 with the domain migration —
          # until then it still named shengchangmd.bahtzang.com, which now 404s,
          # so the live site was declaring a dead host as its canonical URL.
          SITE_URL: https://shengchangmd.com
          # Enabled 2026-08-05 at the owner's request, after the last invented
          # content came off the site. All three original blockers are cleared:
          # the doctor's Chinese name and the immigration-exam scope were
          # confirmed on 2026-07-29, and the fabricated insurance carrier list
          # and payment claims were removed on 2026-08-05.
          #
          # This drives both the robots meta tag (BaseLayout) and robots.txt
          # (src/pages/robots.txt.ts). Unreviewed locales stay noindex
          # regardless, via `reviewed` in locales.ts — so zh-hant and zh-hans
          # remain excluded until a fluent reader has checked them.
          #
          # Before turning this off again, note that un-indexing is far slower
          # than indexing. Anything published here should be true first.
          ALLOW_INDEXING: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
