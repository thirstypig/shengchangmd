name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the Pages deployment to read the repo and mint an ID token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a newer push supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # 42 tests over the i18n layer. They guard defects that typecheck and build
      # cleanly — a practice.ts value with no translation, or a key missing from a
      # locale, either of which puts English or a raw key name in front of a
      # patient. Runs before the build so a locale regression blocks the deploy
      # rather than shipping.
      - name: Tests
        run: npm test

      # `postbuild` runs scripts/verify-css.mjs, which fails the build if the
      # compiled CSS is missing real Tailwind output. That guard exists because
      # this site once shipped with zero compiled CSS while the build passed.
      - run: npm run build
        env:
          # Feeds every canonical URL, sitemap entry, hreflang link and JSON-LD
          # @id. Moved to the apex on 2026-08-05 with the domain migration —
          # until then it still named shengchangmd.bahtzang.com, which now 404s,
          # so the live site was declaring a dead host as its canonical URL.
          SITE_URL: https://shengchangmd.com
          # Omitted deliberately: with this unset the site renders
          # <meta name="robots" content="noindex, nofollow">.
          #
          # Two of the three original blockers are cleared — the doctor's
          # Chinese name and the immigration-exam scope were both confirmed by
          # the owner on 2026-07-29. What remains:
          #   - the insurance carrier list on insurance.astro, which was
          #     generated rather than supplied and is still invented
          #   - the stem cell therapy copy, which is an unconfirmed placeholder
          # Turning this on publishes both to search engines and to the
          # assistants that read structured data. Do not set it until they are
          # resolved.
          # ALLOW_INDEXING: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
